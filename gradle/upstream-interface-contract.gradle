// Independent interface-access / client-list corrections. The existing five-artifact
// resource-only contract and its controls remain unchanged and independently required.
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.UUID

def interfaceSpec = file('src/upstreamRuntime/interface-overrides-v1.json')
def interfaceBuilder = file('scripts/build_upstream_interface_overrides.py')
def interfaceControls = file('scripts/test_upstream_interface_overrides.py')
def legacyBuilder = file('scripts/build_upstream_runtime_overrides.py')
def interfaceSupport = layout.buildDirectory.dir('upstream-interface-overrides')
def interfaceDigest = { File path -> MessageDigest.getInstance('SHA-256').digest(path.bytes).encodeHex().toString() }
def interfaceSafe = { File file ->
    def path = file.toPath().toAbsolutePath()
    while (path != null) {
        if (Files.isSymbolicLink(path)) throw new GradleException("Symlink interface qualification path: ${path}")
        path = path.parent
    }
    file
}

def qualifyUpstreamInterfaceOverrides = tasks.register('qualifyUpstreamInterfaceOverrides') {
    group = 'verification'
    description = 'Qualifies the independent two-archive local-only interface/client-list recipe.'
    dependsOn('stageRuntimeJar')
    inputs.files(interfaceSpec, interfaceBuilder, interfaceControls, legacyBuilder)
    outputs.upToDateWhen { false }
    doLast {
        def retained = interfaceSafe(layout.buildDirectory.dir('upstream-interface-evidence').get().asFile)
        retained.mkdirs()
        def originals = interfaceSafe(new File(retained, "originals-${interfaceDigest(interfaceSpec)}"))
        // Explicit opt-in fetch only into a fresh retained directory. Existing original
        // bytes are checked by the builder; never rewrite/repair an original cache.
        if (!originals.exists()) {
            exec { commandLine('python3', '-B', interfaceBuilder.absolutePath,
                '--fetch-originals', originals.absolutePath) }
        }
        def attempt = interfaceSafe(new File(retained, "attempt-${UUID.randomUUID()}"))
        if (!attempt.mkdir()) throw new GradleException('Fresh interface qualification evidence required')
        exec { commandLine('python3', '-B', interfaceControls.absolutePath,
            '--inputs', originals.absolutePath, '--evidence', new File(attempt, 'controls').absolutePath) }
        def output = new File(attempt, 'qualified')
        exec { commandLine('python3', '-B', interfaceBuilder.absolutePath,
            '--inputs', originals.absolutePath, '--output', output.absolutePath) }
        def spec = new JsonSlurper().parse(interfaceSpec)
        def destination = interfaceSafe(interfaceSupport.get().asFile)
        destination.mkdirs()
        (spec.artifacts.collect { it.output } + ['receipt.json']).each { name ->
            def target = interfaceSafe(new File(destination, name))
            Files.copy(new File(output, name).toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
        logger.lifecycle("Qualified independent local-only interface support; runtime acceptance NOT_EVALUATED; evidence ${attempt}")
    }
}
tasks.named('verifyFast') { dependsOn(qualifyUpstreamInterfaceOverrides) }
