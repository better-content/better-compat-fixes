import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import groovy.json.JsonSlurper

// Lazy FILE SDK inputs: no configuration-time I/O, download, SDK dependency resolution or repo.
// main compileJava retains ordinary fg.deobf(Moonlight), deriving CURRENT private-worker
// official mappings independently. Only afterwards does this bounded SDK stage run.
def enabled = project.findProperty('withNativeForgeApiFixture') == 'true'
def root = new File(gradle.gradleUserHomeDir, 'bettercontent-local-sdk/native-forge-api-v1')
def tool = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/maven_downloader/net/minecraftforge/installertools/1.4.4/installertools-1.4.4-fatjar.jar')
def mapping = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/mcp_repo/net/minecraft/mapping/1.20.1/mapping-1.20.1-mapping.zip')
def hashes = [
    'ffapi-native': '447b9e285717e66e95924e190a13f5a2079b969af70ed4c6577d40cad9423351',
    'moonlight-native': 'ec130f96cb65ce97d600880127322656021bd5c6e60a976de9eb9403e5f3d5a3',
    'base': 'ccfa049091ce36c8ba4fab642c5c7291f4eb7729afed65a43ec1bebd999550a9',
    'interaction': 'bc2e6f06e8791cc98fce43408427d6a5125645c75abb153abdcfa009c3ba458c',
    'resource': '254113f0d62b8b953abe3a20f053060a61ad21c480304442b80275a2389e82de']
def sdkFile = { name ->
    def version = 'official-1.20.1-' + hashes[name]
    new File(root, "maven/bettercontent/nativeforge/fixture/${name}/${version}/${name}-${version}.jar")
}
def prepare = tasks.register('prepareNativeForgeApiSdk') {
    group = 'verification'
    dependsOn('compileJava')
    inputs.files(project.file('scripts/prepare_native_forge_api_sdk.py'))
    // The fresh official mapping is generated by the normal main FG classpath first.
    // Do not snapshot missing mapping/tool paths during configuration or restore historical MCP.
    doLast {
        def output = new ByteArrayOutputStream()
        project.exec {
            commandLine('python3', '-B', project.file('scripts/prepare_native_forge_api_sdk.py'),
                    '--root', root, '--tool', tool, '--mapping', mapping)
            standardOutput = output
        }
        def attempt = new File(output.toString('UTF-8').readLines().first())
        if (attempt.parentFile.canonicalFile != new File(root, 'attempts').canonicalFile)
            throw new GradleException('Native Forge API stage returned unexpected attempt owner')
        logger.lifecycle('Retained native Forge API SDK attempt: ' + attempt)
        hashes.each { name, hash ->
            if (MessageDigest.getInstance('SHA-256').digest(sdkFile(name).bytes).encodeHex().toString() != hash)
                throw new GradleException('Pinned native Forge API SDK artifact drift: ' + name)
        }
        ext.bcNativeForgeApiAttempt = attempt
    }
}
def sdkFiles = { name -> files(sdkFile(name)).builtBy(prepare) }
// Namespace qualification compiles every explicit source role even when not run. These
// compileOnly FILE deps cannot resolve Maven/FG or add duplicate top-level runtime modules.
['base', 'interaction', 'resource', 'moonlight-native'].each { name ->
    dependencies.add(sourceSets.nativeForgeApiFixture.compileOnlyConfigurationName, sdkFiles(name))
}
if (enabled) {
    dependencies.add('runtimeOnly', sdkFiles('moonlight-native'))
    dependencies.add('runtimeOnly', sdkFiles('ffapi-native'))
}
tasks.named(sourceSets.nativeForgeApiFixture.compileJavaTaskName).configure { dependsOn(prepare) }
// Order supported FG per-run preparation as well as execution. A focused real Gradle
// graph/classpath proof is still required before claiming the private-worker closure works.
tasks.matching { it.name == 'runGameTestServer' || it.name == 'writeGameTestServerLegacyClasspath'
        || it.name.startsWith('prepareRunGameTestServer') || it.name.startsWith('prepareGameTestServer') }.configureEach {
    if (enabled) dependsOn(prepare)
}
tasks.named('test').configure {
    dependsOn(prepare)
    doFirst { systemProperty('bc.nativeforge.sdk.attempt', prepare.get().bcNativeForgeApiAttempt.absolutePath) }
}
tasks.register('verifyNativeForgeApiSdk', Exec) {
    group = 'verification'
    dependsOn(prepare)
    doFirst {
        commandLine('python3', '-B', project.file('scripts/test_prepare_native_forge_api_sdk.py'),
                '--attempt', prepare.get().bcNativeForgeApiAttempt,
                '--evidence', layout.buildDirectory.dir('native-forge-api-sdk-controls/' + UUID.randomUUID()).get().asFile)
    }
}
tasks.register('verifyRuntimeMoonlightPlatform') {
    group = 'verification'
    dependsOn('stageRuntimeJar')
    doLast {
        def jar = layout.buildDirectory.file('libs/' + project.property('artifact_name') + '-' + project.version + '.jar').get().asFile
        new ZipFile(jar).withCloseable { zip ->
            def name = 'better_compat_fixes.moonlight_platform.mixins.json'
            def manifest = zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')).withCloseable { new Manifest(it) }
            if (!manifest.mainAttributes.getValue('MixinConfigs').split(',').contains(name))
                throw new GradleException('Required Moonlight platform config not registered')
            def config = zip.getInputStream(zip.getEntry(name)).withCloseable { new JsonSlurper().parse(it) }
            if (config.required != true || config.injectors.defaultRequire != 1
                    || config.package != 'com.bettercontent.bettercompatfixes.mixin.moonlightplatform'
                    || config.plugin != 'com.bettercontent.bettercompatfixes.compat.moonlightplatform.MoonlightPlatformPlugin'
                    || config.mixins != ['MoonlightForgePlatformMixin'] || config.client != [] || config.server != [])
                throw new GradleException('Narrow Moonlight platform config structure drift')
            ['compat/moonlightplatform/NativeForgeApiIdentity', 'compat/moonlightplatform/NativeForgeApiPlatform',
             'compat/moonlightplatform/MoonlightPlatformPlugin', 'mixin/moonlightplatform/MoonlightForgePlatformMixin'].each { path ->
                if (zip.getEntry('com/bettercontent/bettercompatfixes/' + path + '.class') == null)
                    throw new GradleException('Missing required Moonlight platform class: ' + path)
            }
        }
    }
}
tasks.matching { it.name == 'verifyFast' }.configureEach { dependsOn('verifyNativeForgeApiSdk', 'verifyRuntimeMoonlightPlatform') }
